name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Test ARM64 build
    runs-on: macos-26
    permissions:
      contents: read
    env:
      APP_PATH: build/FFmpeg Media Extension.app
    steps:
      - name: Check out repository and FFmpeg
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify ARM64 runner and macOS 26 SDK
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "$SDK_VERSION" == 26.* ]]

      - name: Build ad-hoc-signed app
        run: make

      - name: Verify bundle
        run: bash Tests/run.sh "$APP_PATH"

  release:
    name: Sign, notarize, and release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    env:
      APP_PATH: build/FFmpeg Media Extension.app
      FORMAT_READER_PATH: build/FFmpeg Media Extension.app/Contents/Extensions/MKVFormatReader.appex
      VIDEO_DECODER_PATH: build/FFmpeg Media Extension.app/Contents/Extensions/FFmpegVideoDecoder.appex
      RELEASE_ARCHIVE: dist/ffmpeg-media-extension-macos-arm64.zip
      SOURCE_ARCHIVE: dist/ffmpeg-media-extension-corresponding-source.tar.xz
    steps:
      - name: Check out repository and FFmpeg
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify ARM64 runner and macOS 26 SDK
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "$SDK_VERSION" == 26.* ]]

      - name: Build ad-hoc-signed app
        run: make

      - name: Set bundle version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (for example, v0.1.0)." >&2
            exit 1
          fi

          for PLIST in \
            "$APP_PATH/Contents/Info.plist" \
            "$FORMAT_READER_PATH/Contents/Info.plist" \
            "$VIDEO_DECODER_PATH/Contents/Info.plist"
          do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$PLIST"
          done

      - name: Import Developer ID certificate
        shell: bash
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id.p12
          DEVELOPER_ID_G1_PATH: ${{ runner.temp }}/DeveloperIDCA.cer
          DEVELOPER_ID_G2_PATH: ${{ runner.temp }}/DeveloperIDG2CA.cer
          KEYCHAIN_PATH: ${{ runner.temp }}/ffmpeg-media-extension-signing.keychain-db
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" || -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "The Developer ID certificate secrets are missing." >&2
            exit 1
          fi

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer \
            --output "$DEVELOPER_ID_G1_PATH"
          curl --fail --silent --show-error --location \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$DEVELOPER_ID_G2_PATH"
          printf '%s\n' \
            "7afc9d01a62f03a2de9637936d4afe68090d2de18d03f29c88cfb0b1ba63587f  $DEVELOPER_ID_G1_PATH" \
            "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $DEVELOPER_ID_G2_PATH" \
            | shasum -a 256 --check
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          for INTERMEDIATE_CERTIFICATE_PATH in "$DEVELOPER_ID_G1_PATH" "$DEVELOPER_ID_G2_PATH"; do
            security import "$INTERMEDIATE_CERTIFICATE_PATH" \
              -A \
              -t cert \
              -f x509 \
              -k "$KEYCHAIN_PATH"
          done
          security import "$CERTIFICATE_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "No Developer ID Application identity was found in the imported certificate." >&2
            exit 1
          fi

          CERTIFICATE_ISSUER="$(
            security find-certificate -c "$SIGNING_IDENTITY" -p "$KEYCHAIN_PATH" \
              | openssl x509 -noout -issuer -nameopt RFC2253
          )"
          echo "$CERTIFICATE_ISSUER"
          case "$CERTIFICATE_ISSUER" in
            "issuer=C=US,O=Apple Inc.,OU=Apple Certification Authority,CN=Developer ID Certification Authority")
              echo "::warning::The signing certificate uses Apple Developer ID G1, whose intermediate expires February 1, 2027. Replace the certificate secret with a G2 identity before then."
              ;;
            "issuer=C=US,O=Apple Inc.,OU=G2,CN=Developer ID Certification Authority") ;;
            *)
              echo "The Developer ID Application certificate was not issued by a supported Apple Developer ID authority." >&2
              exit 1
              ;;
          esac

          SIGNING_CERTIFICATE_SHA256="$(
            security find-certificate -c "$SIGNING_IDENTITY" -p "$KEYCHAIN_PATH" \
              | openssl x509 -outform DER \
              | shasum -a 256 \
              | awk '{print $1}'
          )"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_CERTIFICATE_SHA256=$SIGNING_CERTIFICATE_SHA256" >> "$GITHUB_ENV"

      - name: Install and validate Developer ID profiles
        shell: bash
        env:
          FORMAT_READER_PROFILE: ${{ secrets.FORMAT_READER_PROVISIONING_PROFILE }}
          VIDEO_DECODER_PROFILE: ${{ secrets.VIDEO_DECODER_PROVISIONING_PROFILE }}
          FORMAT_READER_SIGNING_ENTITLEMENTS: ${{ runner.temp }}/format-reader-signing-entitlements.plist
          VIDEO_DECODER_SIGNING_ENTITLEMENTS: ${{ runner.temp }}/video-decoder-signing-entitlements.plist
        run: |
          if [[ -z "$FORMAT_READER_PROFILE" || -z "$VIDEO_DECODER_PROFILE" ]]; then
            echo "The MediaExtension Developer ID provisioning-profile secrets are missing." >&2
            exit 1
          fi

          install_profile() {
            local encoded_profile="$1"
            local embedded_path="$2"
            local decoded_path="$3"
            local base_entitlements="$4"
            local signing_entitlements="$5"
            local expected_bundle_id="$6"
            local required_entitlement="$7"

            printf '%s' "$encoded_profile" | base64 --decode > "$embedded_path"
            security cms -D -i "$embedded_path" -o "$decoded_path"

            local all_devices
            all_devices="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$decoded_path" 2>/dev/null || true)"
            if [[ "$all_devices" != "true" ]]; then
              echo "The profile for $expected_bundle_id is not a Developer ID profile." >&2
              exit 1
            fi

            local certificate_index=0
            local matching_certificate=false
            local profile_certificate_fingerprints=""
            local encoded_certificate
            while encoded_certificate="$(plutil -extract "DeveloperCertificates.$certificate_index" raw "$decoded_path" 2>/dev/null)"; do
              local profile_certificate_sha256
              profile_certificate_sha256="$(
                printf '%s' "$encoded_certificate" \
                  | base64 --decode \
                  | openssl x509 -inform DER -outform DER \
                  | shasum -a 256 \
                  | awk '{print $1}'
              )"
              profile_certificate_fingerprints="${profile_certificate_fingerprints}${profile_certificate_fingerprints:+, }${profile_certificate_sha256}"
              if [[ "$profile_certificate_sha256" == "$SIGNING_CERTIFICATE_SHA256" ]]; then
                matching_certificate=true
                break
              fi
              certificate_index=$((certificate_index + 1))
            done
            if [[ "$matching_certificate" != "true" ]]; then
              echo "The profile for $expected_bundle_id is bound to Developer ID certificate(s) $profile_certificate_fingerprints, but the imported signing certificate is $SIGNING_CERTIFICATE_SHA256." >&2
              echo "Replace the certificate and provisioning-profile secrets with one matching set." >&2
              exit 1
            fi

            local application_identifier team_identifier
            application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$decoded_path")"
            team_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.team-identifier' "$decoded_path")"
            if [[ "$application_identifier" != "$team_identifier.$expected_bundle_id" ]]; then
              echo "The profile application identifier does not match $expected_bundle_id." >&2
              exit 1
            fi

            local entitlement_value
            entitlement_value="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:$required_entitlement" "$decoded_path" 2>/dev/null || true)"
            if [[ "$entitlement_value" != "true" ]]; then
              echo "The profile does not authorize $required_entitlement." >&2
              exit 1
            fi

            cp "$base_entitlements" "$signing_entitlements"
            /usr/libexec/PlistBuddy \
              -c "Add :com.apple.application-identifier string $application_identifier" \
              -c "Add :com.apple.developer.team-identifier string $team_identifier" \
              "$signing_entitlements"
          }

          install_profile \
            "$FORMAT_READER_PROFILE" \
            "$FORMAT_READER_PATH/Contents/embedded.provisionprofile" \
            "${RUNNER_TEMP}/format-reader-profile.plist" \
            "Resources/FormatReader.entitlements" \
            "$FORMAT_READER_SIGNING_ENTITLEMENTS" \
            "lv.apps.ffmpeg-media-extension.formatreader.mkv" \
            "com.apple.developer.mediaextension.formatreader"
          install_profile \
            "$VIDEO_DECODER_PROFILE" \
            "$VIDEO_DECODER_PATH/Contents/embedded.provisionprofile" \
            "${RUNNER_TEMP}/video-decoder-profile.plist" \
            "Resources/VideoDecoder.entitlements" \
            "$VIDEO_DECODER_SIGNING_ENTITLEMENTS" \
            "lv.apps.ffmpeg-media-extension.videodecoder.vp9" \
            "com.apple.developer.mediaextension.videodecoder"

      - name: Sign app with Developer ID
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/ffmpeg-media-extension-signing.keychain-db
          FORMAT_READER_SIGNING_ENTITLEMENTS: ${{ runner.temp }}/format-reader-signing-entitlements.plist
          VIDEO_DECODER_SIGNING_ENTITLEMENTS: ${{ runner.temp }}/video-decoder-signing-entitlements.plist
        run: |
          codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            --entitlements "$FORMAT_READER_SIGNING_ENTITLEMENTS" \
            --sign "$SIGNING_IDENTITY" \
            "$FORMAT_READER_PATH"
          codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            --entitlements "$VIDEO_DECODER_SIGNING_ENTITLEMENTS" \
            --sign "$SIGNING_IDENTITY" \
            "$VIDEO_DECODER_PATH"
          codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$SIGNING_IDENTITY" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          verify_signed_extension() {
            local bundle_path="$1"
            local expected_entitlements="$2"
            local actual_entitlements="$3"
            local required_entitlement="$4"

            codesign -d --entitlements :- "$bundle_path" 2>/dev/null > "$actual_entitlements"
            for entitlement in \
              com.apple.application-identifier \
              com.apple.developer.team-identifier \
              com.apple.security.app-sandbox \
              "$required_entitlement"
            do
              local expected_value actual_value
              expected_value="$(/usr/libexec/PlistBuddy -c "Print :$entitlement" "$expected_entitlements")"
              actual_value="$(/usr/libexec/PlistBuddy -c "Print :$entitlement" "$actual_entitlements")"
              if [[ "$actual_value" != "$expected_value" ]]; then
                echo "Signed entitlement $entitlement does not match the provisioning profile for $bundle_path." >&2
                exit 1
              fi
            done
          }

          verify_signed_extension \
            "$FORMAT_READER_PATH" \
            "$FORMAT_READER_SIGNING_ENTITLEMENTS" \
            "${RUNNER_TEMP}/format-reader-signed-entitlements.plist" \
            "com.apple.developer.mediaextension.formatreader"
          verify_signed_extension \
            "$VIDEO_DECODER_PATH" \
            "$VIDEO_DECODER_SIGNING_ENTITLEMENTS" \
            "${RUNNER_TEMP}/video-decoder-signed-entitlements.plist" \
            "com.apple.developer.mediaextension.videodecoder"

          SIGNATURE_INFO="$(codesign --display --verbose=4 "$APP_PATH" 2>&1)"
          echo "$SIGNATURE_INFO"
          grep -F "Authority=Developer ID Application:" <<< "$SIGNATURE_INFO"
          grep -F "Authority=Developer ID Certification Authority" <<< "$SIGNATURE_INFO"

      - name: Notarize and staple
        shell: bash
        env:
          API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          NOTARY_ARCHIVE: ${{ runner.temp }}/ffmpeg-media-extension-notarization.zip
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -z "$APPLE_API_KEY" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER_ID" ]]; then
            echo "The App Store Connect API secrets are missing." >&2
            exit 1
          fi

          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ARCHIVE"
          xcrun notarytool submit "$NOTARY_ARCHIVE" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Package release
        shell: bash
        env:
          VERIFY_DIR: ${{ runner.temp }}/release-verification
          SOURCE_STAGING_DIR: ${{ runner.temp }}/corresponding-source
        run: |
          mkdir -p dist "$VERIFY_DIR"
          ditto -c -k --keepParent "$APP_PATH" "$RELEASE_ARCHIVE"
          ditto -x -k "$RELEASE_ARCHIVE" "$VERIFY_DIR"
          codesign --verify --deep --strict --verbose=2 "$VERIFY_DIR/FFmpeg Media Extension.app"
          xcrun stapler validate "$VERIFY_DIR/FFmpeg Media Extension.app"
          spctl --assess --type execute --verbose=2 "$VERIFY_DIR/FFmpeg Media Extension.app"

          for NOTICE_PATH in \
            "Project-MIT-License.txt" \
            "Third-Party-Notices.md" \
            "FFmpeg-LGPL-2.1.txt"
          do
            test -f "$VERIFY_DIR/FFmpeg Media Extension.app/Contents/Resources/$NOTICE_PATH"
          done

          SOURCE_ROOT="ffmpeg-media-extension-${GITHUB_REF_NAME}-source"
          mkdir -p "$SOURCE_STAGING_DIR/$SOURCE_ROOT/FFmpeg"
          git archive "$GITHUB_SHA" | tar -xf - -C "$SOURCE_STAGING_DIR/$SOURCE_ROOT"
          git -C FFmpeg diff --quiet
          git -C FFmpeg archive HEAD | tar -xf - -C "$SOURCE_STAGING_DIR/$SOURCE_ROOT/FFmpeg"
          {
            printf 'FFmpeg Media Extension tag: %s\n' "$GITHUB_REF_NAME"
            printf 'FFmpeg Media Extension commit: %s\n' "$GITHUB_SHA"
            printf 'FFmpeg commit: %s\n' "$(git -C FFmpeg rev-parse HEAD)"
          } > "$SOURCE_STAGING_DIR/$SOURCE_ROOT/SOURCE-VERSIONS.txt"
          tar -C "$SOURCE_STAGING_DIR" -cJf "$SOURCE_ARCHIVE" "$SOURCE_ROOT"
          tar -tf "$SOURCE_ARCHIVE" | grep -Fqx "$SOURCE_ROOT/LICENSE"
          tar -tf "$SOURCE_ARCHIVE" | grep -Fqx "$SOURCE_ROOT/THIRD_PARTY_NOTICES.md"
          tar -tf "$SOURCE_ARCHIVE" | grep -Fqx "$SOURCE_ROOT/FFmpeg/COPYING.LGPLv2.1"
          tar -tf "$SOURCE_ARCHIVE" | grep -Fqx "$SOURCE_ROOT/SOURCE-VERSIONS.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_ARCHIVE#Notarized Apple-silicon application" \
            "$SOURCE_ARCHIVE#Complete corresponding source, including FFmpeg" \
            --verify-tag \
            --generate-notes \
            --notes "This application contains statically linked FFmpeg libraries licensed under the GNU LGPL v2.1 or later. The complete corresponding source used for this build is attached to this release." \
            --title "FFmpeg Media Extension $GITHUB_REF_NAME"

      - name: Remove temporary credentials
        if: always()
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id.p12
          DEVELOPER_ID_G1_PATH: ${{ runner.temp }}/DeveloperIDCA.cer
          DEVELOPER_ID_G2_PATH: ${{ runner.temp }}/DeveloperIDG2CA.cer
          KEYCHAIN_PATH: ${{ runner.temp }}/ffmpeg-media-extension-signing.keychain-db
          API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          NOTARY_ARCHIVE: ${{ runner.temp }}/ffmpeg-media-extension-notarization.zip
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f \
            "$CERTIFICATE_PATH" \
            "$DEVELOPER_ID_G1_PATH" \
            "$DEVELOPER_ID_G2_PATH" \
            "$API_KEY_PATH" \
            "$NOTARY_ARCHIVE" \
            "${RUNNER_TEMP}/format-reader-profile.plist" \
            "${RUNNER_TEMP}/video-decoder-profile.plist" \
            "${RUNNER_TEMP}/format-reader-signing-entitlements.plist" \
            "${RUNNER_TEMP}/video-decoder-signing-entitlements.plist" \
            "${RUNNER_TEMP}/format-reader-signed-entitlements.plist" \
            "${RUNNER_TEMP}/video-decoder-signed-entitlements.plist"
